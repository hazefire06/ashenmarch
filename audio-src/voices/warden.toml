unit = "warden"

[voice.warden]
description = "an older Highland Scots woman, warm and brisk, a mid-range mezzo with a smoker's rasp, scolding like a grandmother"
model = "eleven_v4"

[line.select_1]
trigger = "select"
text = "Aye, whit's wrang wi' ye now?"
picks = {}

[line.select_2]
trigger = "select"
text = "Ah've herbs fer whit ails ye, an' a stick fer whit doesnae."
picks = {}

[line.select_3]
trigger = "select"
text = "Show me where it hurts."
picks = {}

[line.move_1]
trigger = "move"
text = "Ah'm comin', ah'm comin'. Ma knees arenae."
picks = {}

[line.move_2]
trigger = "move"
