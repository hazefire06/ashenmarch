# The cue book: every sound the game makes, with its generation prompt and settings.
# Schema and rules: docs/specs/2026-11-09-art-a2-audio-design.md section 9.2. scripts/audio/cuebook.py checks it.
# Ids become file names, so they match [a-z0-9_]+. level_db carries the old placeholder level where one exists.

[style]
suffix = "realistic close foley, grounded and gritty, a single sound effect"
vocal_suffix = "realistic close recording of a single wordless vocal sound, grounded and gritty"

[defaults]
variants = 3
takes = 6
bus = "Effects"
level_db = 0.0
max_voices = 3
pitch_spread = 0.06
model = "eleven_text_to_sound_v2"
prompt_influence = 0.5

[playback]
melee = "sample"
projectile = "sample"
death = "sample"
groan = "sample"
ui = "sample"
march = "stream"
bed = "stream"
music = "stream"

