# The world art sources, read by scripts/art/world_assets.py (make world-assets). Only CC0 packs from ambientcg, polyhaven, quaternius
# or kenney are accepted. Paths are relative to art-src/world/. The houses, wall, gate and mill are
# assembled from MegaKit pieces by scripts/art/assemble_world_kit.py (see its docstring).
#
# [source.<id>]            name, url, licence = "CC0", site = "ambientcg" | "polyhaven" | "quaternius" | "kenney"
# [ground.<layer>]         for grass, brush, forest, sand, rock, mud: source, albedo, normal
# [models.<name>]          source, file (.glb or .gltf), and optionally folder: the models naming one folder are written to
#                          assets/world/models/<folder>/ and share the textures and buffers they have in common
#
# The ground scatter (view/scatter/) comes from the Stylized Nature MegaKit (Standard): its glTF/ files for the models below, with
# the buffers and textures they use and the pack's licence, unpacked into quaternius/nature/ (the zip stays out of git).

