# Riverside's two music layers (spec section 3). Same key and tempo so they cross-fade cleanly.
# scripts/audio/cuebook.py checks this file. Each prompt ends with the shared key and tempo line.
# Prompts say what to play, never what to leave out: a generator tends to make the thing it is told about.

[layer.riverside_calm]
prompt = """
Sparse, brooding instrumental music for a quiet ruined village by a creek at dusk, played by a small rough acoustic folk ensemble. A low sustained drone, a slow soft frame drum pulse, and a single lone fiddle or highland pipes playing a thin mournful melody with long silences between phrases. Cold, patient and uneasy, raw and close, like players around a fire.
Key of D minor, 84 beats per minute, 4/4, steady tempo throughout."""
length_s = 110
model = "music_v2"
takes = 3
picks = [1]

[layer.riverside_combat]
prompt = """
Tense, urgent instrumental music for a skirmish against the walking dead, played by a small rough acoustic folk band. The same low drone now driving, heavy frame drums and a deep war drum hitting hard on the beat, rough sawing fiddle and skirling highland pipes playing a harsher, faster version of a mournful melody. Gritty, pressing and physical, raw and close.
Key of D minor, 84 beats per minute, 4/4, steady tempo throughout."""
length_s = 110
model = "music_v2"
takes = 3
picks = [2]
